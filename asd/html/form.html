<!DOCTYPE html>
<!-- Especifica la versión de HTML (HTML5) y el idioma del sitio (español) -->
<html lang="es">

<head>

  <!-- Define la codificación de caracteres para permitir tildes y caracteres especiales -->
  <meta charset="UTF-8">
  
  <!-- Hace que el diseño sea adaptable a pantallas de móviles y tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título que aparece en la pestaña del navegador -->
  <title>Iniciar Sesión</title>

  <!-- Enlace al archivo CSS externo donde se almacenan los estilos visuales -->
  <link rel="stylesheet" href="../css/decoracion.css">
</head>

<body>
    <h2 class ="tituloA">UniMarcket</h2>
  <!-- Contenedor principal del formulario de inicio de sesión -->
  <div class="login-container">
    
    <h2>Inicio sesion</h2>


    <form action="/login" method="POST">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ingrese su correo" required>
      </div>   
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
      </div>
      <button type="submit" class="btn-submit">Ingresar</button>
      <div class="form-footer">
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
      </div>

    </form>
  </div>

</body>
</html>
